<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
</head>
<body>
    <h1>Produtos</h1>
    <p><a th:href="@{/estoque}">Ir para Controle de Estoque</a></p>

    <form th:action="@{/products}" th:object="${novoProduto}" method="post">
        <input type="text" th:field="*{nome}" placeholder="Nome do produto" required />
        <input type="number" step="0.01" th:field="*{preco}" placeholder="Preço" required />
        <button type="submit">Cadastrar</button>
    </form>

    <table border="1" cellpadding="8" style="margin-top: 16px;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${produtos}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nome}"></td>
                <td th:text="${p.preco}"></td>
                <td th:text="${p.quantidadeEstoque}"></td>
                <td th:text="${p.status}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
